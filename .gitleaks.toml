[extend]
useDefault = true

[[allowlists]]
description = "A test-only credential key: config_test.go checks that Load accepts and redacts it, and it protects nothing"
paths = [
 '''internal/config/config_test\.go$'''
]

[[allowlists]]
description = "Idempotency keys in send tests and their contract fixture: UUIDs a client invents per message, which authorize nothing"
paths = [
 '''internal/api/send_test\.go$''',
 '''internal/api/contract_test\.go$''',
 '''internal/api/testdata/contract/send_status\.json$''',
 '''internal/api/testdata/contract/key_sends\.json$'''
]

[[allowlists]]
description = "The key scheme's golden vectors and the specification's worked example: keys, wraps and grants derived from fixed test seeds, which protect nothing"
paths = [
 '''internal/keyscheme/testdata/[a-z-]+\.json$''',
 '''docs/key-scheme\.md$'''
]

[[allowlists]]
description = "An issued key's selector in two tests: the public half of a key, which the logs keep as they keep an own key's prefix, made of test digits; it authorizes nothing"
condition = "AND"
paths = [
 '''internal/obs/redact_test\.go$''',
 '''internal/store/migrate_twentyeight_test\.go$'''
]
regexes = [
 '''^tst_9f3c0a7be41d2c58$''',
 '''^0123456789abcdef$'''
]
