# Plain IMAP on 143 for the tests; the client is told to allow it explicitly,
# and only the integration tier does.
ssl = no
auth_allow_cleartext = yes

# Roles come from these attributes, which is the path Gmail exercises and the
# in-process server cannot.
namespace inbox {
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# XOAUTH2 as Gmail and Microsoft take it, for the links at the provider
# (internal/account/integration_test.go): an access token is a JWT with a
# sub, whose email claim must be the user= the client names, validated here
# with a test-only HMAC key (it/dovecot/oauth2-keys.dict) that protects
# nothing.
# Passwords stay with the image's static passdb.
auth_mechanisms = plain login xoauth2 oauthbearer

passdb static {
  mechanisms_filter = plain login
}

oauth2 {
  introspection_mode = local
  username_attribute = email
}

oauth2_local_validation {
  dict file {
    path = /etc/dovecot/oauth2-keys.dict
  }
}

passdb oauth2 {
  mechanisms_filter = xoauth2 oauthbearer
}
