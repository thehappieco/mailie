# Plain IMAP on 143 for the tests; the client is told to allow it explicitly,
# and only the integration tier does.
ssl = no
auth_allow_cleartext = yes

# Roles come from these attributes, which is the path Gmail exercises and the
# in-process server cannot.
namespace inbox {
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}
