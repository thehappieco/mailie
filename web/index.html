<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- The session token lives in this page. The daemon sends the same policy
         as a header from internal/webui; frame-ancestors is absent here because
         a browser ignores it in a meta element and warns, so only the header
         carries it, together with X-Frame-Options. Inline style is allowed
         as the header allows it (internal/webui serves every edition, and one
         that shows a message's HTML does so in a sandboxed srcdoc frame that
         inherits this policy); inline script never is. worker-src allows the
         one worker the page starts, the key scheme's Argon2id (the kit's
         kdf.worker.js, JavaScript: no WebAssembly). -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" />
    <!-- An OAuth return carries the provider's code in the query until the
         page strips it; no-referrer keeps it out of every outgoing request. -->
    <meta name="referrer" content="no-referrer" />
    <!-- Provisional Mailie mark (see src/brand/mark.ts). No manifest: nothing
         here needs installing, and the daemon types files by extension. -->
    <link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: light)" href="/favicon-light.svg" />
    <link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: dark)" href="/favicon-dark.svg" />
    <title>Mailie Console</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
